<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden · Keven Ohlew</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="description" content="Diese Adresse gibt es im Portfolio nicht. Der Weg zurück führt zur Startseite.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root{
    --bg:#0B0E13;
    --ink:#F0EBE3;
    --ink-soft:rgba(240,235,227,.74);
    --ink-mute:rgba(240,235,227,.52);
    --acid:#E0684A;
    --rust:#C4341A;
    --hair:rgba(224,104,74,.22);
    --f-display:Fraunces,Georgia,serif;
    --f-body:Hanken,system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:300;
    min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;align-items:center}
  .wrap{width:min(1080px,90vw);margin:0 auto;padding:clamp(64px,10vw,132px) 0}
  .kante{width:78px;height:4px;background:var(--rust);margin-bottom:2rem}
  .code{font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--acid);margin-bottom:1rem}
  h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,5vw,3.4rem);
    letter-spacing:-.02em;line-height:1.1;margin-bottom:1.1rem;max-width:20ch}
  p{font-size:clamp(1rem,1.4vw,1.12rem);line-height:1.65;color:var(--ink-soft);max-width:52ch}
  .wege{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2.4rem}
  .btn{display:inline-flex;align-items:center;font-family:var(--f-body);font-weight:500;
    font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
    padding:.95rem 1.5rem;border-radius:2px;transition:transform .25s,border-color .25s,color .25s,background .25s}
  .btn--voll{background:var(--rust);color:#F0EBE3}
  .btn--voll:hover{transform:translateY(-2px)}
  .btn--linie{border:1px solid var(--hair);color:var(--ink-soft)}
  .btn--linie:hover{transform:translateY(-2px);border-color:var(--acid);color:var(--acid)}
  a:focus-visible{outline:2px solid var(--acid);outline-offset:3px}
  footer{border-top:1px solid var(--hair);padding:1.5rem 0}
  footer .wrap{padding:0;display:flex;flex-wrap:wrap;gap:.8rem 1.8rem;
    align-items:center;justify-content:space-between}
  footer a{font-size:.76rem;color:var(--ink-mute);text-decoration:none}
  footer a:hover{color:var(--acid)}
  .mark{font-family:var(--f-display);font-size:1rem;letter-spacing:-.01em}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="kante" aria-hidden="true"></div>
    <p class="code">Fehler 404</p>
    <h1>Diese Seite gibt es nicht.</h1>
    <p>Vielleicht ein Tippfehler, vielleicht ein alter Link. Die vier Fallstudien liegen alle auf der Startseite.</p>
    <div class="wege">
      <a class="btn btn--voll" href="/">Zur Startseite</a>
      <a class="btn btn--linie" href="/#proof">Fallstudien</a>
      <a class="btn btn--linie" href="https://keven-ohlew.com">keven-ohlew.com</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <span class="mark">Keven Ohlew</span>
    <span>
      <a href="/impressum.html">Impressum</a>
      &nbsp;&nbsp;
      <a href="/datenschutz.html">Datenschutz</a>
    </span>
  </div>
</footer>
</body>
</html>
